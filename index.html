<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Recognition Wall</title>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0 }
header { background:#243447; color:white; padding:15px; text-align:center }

.container {
  display:grid;
  grid-template-columns: 2fr 1fr;
  gap:20px;
  padding:20px;
}

.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  gap:10px;
}

.avatar img {
  width:50px;
  height:50px;
}

.form {
  background:white;
  padding:15px;
  margin-bottom:20px;
  border-radius:12px;
}

button {
  background:green;
  color:white;
  padding:10px;
  border:none;
}

</style>
</head>

<body>

<header>Recognition Wall 🚀</header>

<div class="container">

<div>

<div class="form">
<select id="user"></select>
<input id="by" placeholder="Tu nombre">
<input id="reason" placeholder="Motivo">
<button onclick="add()">Reconocer</button>
</div>

<div id="feed"></div>
</div>

<div>
<h3>🏆 Leaderboard</h3>
<div id="leaderboard"></div>
</div>

</div>

<script>

const API = "https://recognition-backend-lz5r.onrender.com/recognitions";
const API_KEY = "recognition123secure";

// ✅ LISTA DE USUARIOS
const USERS = [
"Edgar Díaz","Fernanda Sedano","Hugo Rincón","Fernanda Silva","Silvia Medellín",
"Carlos Uh","Edgar Pérez","Eduardo Carrillo","Eduardo Ríos","Gustavo Baez",
"Gustavo Polo","Julián Aguilar","Noé Tovar","David Soto","Edison Juárez",
"Eduardo Lazcano","Fernanda Alatorre","Indira Cortés","Juan López",
"Juan Rodríguez","Karla Villa","Luis Nualart","Majo Jiménez",
"Valeria Legorreta","Zared Torres","Adriana Castro","Diego Hernández",
"Enrique Ramírez","Pedro Escamilla","Karla Domínguez","Francisco Pedraza",
"Georgina Bernardo","Jonathan Tapia","Roberto Grijalva","Tomás Gutiérrez",
"Marco Quintas","Salvador Saucedo","Xaver Medina","Braulio Cossio",
"Emmanuel Gutiérrez","Ignacio Padrón","Luis González","Luis Monreal",
"Luis García","Merith Martínez","Sergio Olvera","Sonny Castro"
];

// llenar dropdown
const select = document.getElementById("user");
USERS.forEach(u=>{
  const opt = document.createElement("option");
  opt.value = u;
  opt.text = u;
  select.appendChild(opt);
});

// avatar
function avatar(name){
  return `https://api.dicebear.com/9.x/bottts/svg?seed=${name}`;
}

async function load(){
  const res = await fetch(API, {headers:{"x-api-key":API_KEY}});
  const data = await res.json();

  const feed = document.getElementById("feed");
  feed.innerHTML="";

  data.reverse().forEach(r=>{
    feed.innerHTML += `
      <div class="card">
        <div class="avatar">
          <img src="${avatar(r.recognizedUser)}"/>
        </div>
        <div>
          <b>${r.recognizedUser}</b>
          <p>${r.reason}</p>
        </div>
      </div>
    `;
  });

  const lbRes = await fetch(API+"/leaderboard",{headers:{"x-api-key":API_KEY}});
  const lb = await lbRes.json();

  document.getElementById("leaderboard").innerHTML =
    lb.slice(0,5).map(x=>`<div>${x.name} - ${x.points}</div>`).join("");
}

async function add(){
  const user = document.getElementById("user").value;
  const by = document.getElementById("by").value;
  const reason = document.getElementById("reason").value;

  await fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":API_KEY
    },
    body:JSON.stringify({
      recognizedUser:user,
      recognizedBy:by,
      reason:reason
    })
  });

  load();
}

load();

</script>

</body>
</html>
