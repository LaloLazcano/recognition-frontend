<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Recognition Wall</title>

  <style>
    :root{
      --schneider-green:#3DCD58; /* SE Life Green [3](https://schneiderelectric-my.sharepoint.com/personal/sesa731668_se_com/_layouts/15/Doc.aspx?sourcedoc=%7BC801F037-59F1-4DD5-ADCE-766A214A539F%7D&file=Microgrid%20quarterly%20report%20-%20Q1%2026.pptx&action=edit&mobileredirect=true&DefaultItemOpen=1) */
      --navy:#243447;
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow:0 12px 28px rgba(15,23,42,.10);
      --shadow2:0 6px 14px rgba(15,23,42,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(900px 380px at 10% -10%, rgba(61,205,88,.20), transparent 60%),
        radial-gradient(900px 380px at 110% 0%, rgba(61,205,88,.14), transparent 55%),
        var(--bg);
      color:var(--text);
    }

    header{
      position:sticky; top:0; z-index:10;
      background:linear-gradient(90deg, #1f2a38, var(--navy) 40%, #1f2a38);
      padding:14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight:950;
      letter-spacing:.2px;
      font-size:18px;
    }
    .brand .title{
      color:var(--schneider-green);
      font-size:20px;
    }
    .chip{
      font-size:12px;
      color:#fff;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:6px 10px;
      font-weight:800;
      display:flex; gap:6px; align-items:center;
    }
    .status{
      color:#fff;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      white-space:nowrap;
    }

    .wrap{
      max-width:1400px;
      margin:18px auto;
      padding:0 16px 28px;
      display:grid;
      grid-template-columns: 3.2fr 1.2fr; /* aprovecha mejor pantalla */
      gap:16px;
    }

    .panel{
      background:rgba(255,255,255,.86);
      backdrop-filter: blur(8px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .panel h2{
      margin:0;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      color:var(--muted);
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.35px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .panel h2 small{
      font-size:12px;
      font-weight:800;
      text-transform:none;
      letter-spacing:0;
      color:var(--muted);
    }

    /* Composer */
    .composer{
      padding:16px;
      display:grid;
      gap:12px;
    }
    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .field{display:flex; flex-direction:column; gap:6px;}
    label{font-size:12px; color:var(--muted); font-weight:900;}
    input, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      background:#fff;
      font-size:14px;
    }
    textarea{
      min-height: 160px; /* MÁS GRANDE */
      resize: vertical;
    }
    input:focus, textarea:focus{
      border-color:#94a3b8;
      box-shadow:0 0 0 3px rgba(148,163,184,.25);
    }

    .valueBar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }
    .valueButtons{
      display:flex; flex-wrap:wrap; gap:8px;
    }
    .vbtn{
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      padding:8px 10px;
      font-weight:900;
      font-size:12px;
      cursor:pointer;
      display:flex; gap:6px; align-items:center;
      box-shadow: var(--shadow2);
      user-select:none;
    }
    .vbtn.active{
      border-color: rgba(61,205,88,.65);
      box-shadow:0 0 0 3px rgba(61,205,88,.18);
    }

    .btn{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      background:linear-gradient(180deg, var(--schneider-green), #26b84f);
      color:#0b1220;
      font-weight:950;
      cursor:pointer;
      box-shadow: var(--shadow2);
      display:flex; align-items:center; gap:8px;
    }
    .btn:hover{ filter:brightness(1.03); transform: translateY(-1px); }
    .btn:disabled{ opacity:.65; cursor:not-allowed; transform:none; }

    .hint{
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      font-weight:900;
    }

    /* Feed */
    .feed{
      padding:14px;
      display:grid;
      gap:14px;
      grid-template-columns: repeat(4, minmax(0,1fr));
      align-items:start;
    }

    .tile{
      border-radius:20px;
      overflow:hidden;
      box-shadow: var(--shadow);
      border:1px solid rgba(15,23,42,.06);
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition: transform .14s ease, box-shadow .14s ease;
      background:#111827;
      min-height: 280px; /* más alto por defecto */
    }
    .tile:hover{
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(15,23,42,.14);
    }

    .tileTop{
      padding:14px 14px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      color:#fff;
    }
    .who{display:flex; gap:10px; align-items:center; min-width:0;}
    .avatar{
      width:44px; height:44px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.25);
      overflow:hidden;
      background:rgba(255,255,255,.12);
      flex:0 0 auto;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }

    .names{min-width:0;}
    .recognized{
      font-weight:950;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 210px;
    }
    .by{
      font-size:12px;
      opacity:.9;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 210px;
    }

    .tag{
      font-size:12px;
      font-weight:950;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.20);
      white-space:nowrap;
    }

    .tileCenter{
      padding:0 14px 12px;
      color:#fff;
    }
    /* ✅ NO CORTAR TEXTO: se muestra completo y la tarjeta crece */
    .comment{
      font-size:14px;
      line-height:1.35;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow:0 8px 18px rgba(0,0,0,.25);
    }

    .tileBottom{
      padding:12px 14px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.22));
      color:#fff;
    }
    .actions{display:flex; gap:10px; align-items:center;}
    .likeBtn{
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.10);
      color:#fff;
      border-radius:999px;
      padding:8px 10px;
      font-weight:950;
      font-size:12px;
      cursor:pointer;
      display:flex; gap:6px; align-items:center;
    }
    .likeBtn:hover{ background:rgba(255,255,255,.16); }
    .pts{
      font-size:12px;
      font-weight:950;
      padding:8px 10px;
      border-radius:999px;
      background:rgba(61,205,88,.18);
      border:1px solid rgba(61,205,88,.35);
      color:#eaffef;
      white-space:nowrap;
    }

    /* Right sidebar */
    .side{
      padding:12px 14px;
      display:grid;
      gap:12px;
    }
    .box{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow: var(--shadow2);
    }
    .boxHeader{
      padding:12px 12px;
      font-weight:950;
      color:#0f172a;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .boxHeader small{ color:var(--muted); font-weight:900; font-size:12px; }
    .boxBody{ padding:10px 12px; display:grid; gap:10px; }

    .topCard{
      background:linear-gradient(135deg, rgba(61,205,88,.22), rgba(61,205,88,.08));
      border:1px solid rgba(61,205,88,.35);
      border-radius:18px;
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .topLeft{ display:flex; gap:10px; align-items:center; min-width:0; }
    .miniAvatar{
      width:42px; height:42px;
      border-radius:16px;
      border:1px solid rgba(15,23,42,.08);
      overflow:hidden;
      background:#fff;
      flex:0 0 auto;
    }
    .miniAvatar img{ width:100%; height:100%; object-fit:cover; }
    .topName{
      font-weight:950;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:180px;
    }
    .topPts{
      font-weight:950;
      font-size:14px;
      white-space:nowrap;
    }

    .lbRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-top:1px solid var(--border);
    }
    .lbRow:first-child{ border-top:0; }
    .lbLeft{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .lbRank{ font-weight:950; width:22px; text-align:center; }
    .lbName{
      font-weight:900; font-size:13px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:160px;
    }
    .lbPts{ font-weight:950; font-size:13px; white-space:nowrap; }

    /* Pending list */
    .pendingRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-top:1px solid var(--border);
      cursor:pointer;
    }
    .pendingRow:first-child{ border-top:0; }
    .pendingLeft{ display:flex; align-items:center; gap:10px; min-width:0; }
    .pendingName{
      font-weight:900; font-size:13px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:175px;
    }
    .daysChip{
      font-weight:950;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(15,23,42,.12);
      background:rgba(15,23,42,.04);
      white-space:nowrap;
    }

    .toast{
      position:fixed;
      bottom:18px; right:18px;
      background:#0b1220;
      color:#fff;
      padding:12px 14px;
      border-radius:16px;
      box-shadow: var(--shadow);
      opacity:0;
      transform:translateY(8px);
      transition:.16s ease;
      max-width:360px;
      font-size:13px;
      z-index:50;
    }
    .toast.show{ opacity:1; transform:translateY(0); }

    /* IMPACT backgrounds */
    .bg-inclusion { background: linear-gradient(135deg, #7c3aed, #22c55e); }
    .bg-mastery   { background: linear-gradient(135deg, #2563eb, #22c55e); }
    .bg-purpose   { background: linear-gradient(135deg, #0ea5e9, #22c55e); }
    .bg-action    { background: linear-gradient(135deg, #f97316, #22c55e); }
    .bg-curiosity { background: linear-gradient(135deg, #ec4899, #22c55e); }
    .bg-teamwork  { background: linear-gradient(135deg, #10b981, #0ea5e9); }

    @media (max-width: 1200px){
      .feed{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (max-width: 950px){
