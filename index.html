<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recognition Wall</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='20' fill='%233DCD58'/>
<text x='50%' y='60%' font-size='50' text-anchor='middle' fill='white'>⚡</text>
</svg>">

<style>

:root{
 --green:#3DCD58;
 --bg:#f5f7fb;
 --text:#0f172a;
}

body{
 margin:0;
 font-family:Arial;
 background:var(--bg);
}

/* HEADER */
header{
 background:var(--green);
 color:white;
 padding:15px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

/* LEFT */
.header-left{
 display:flex;
 align-items:center;
 gap:10px;
}

.logo{
 background:white;
 color:#3DCD58;
 width:35px;
 height:35px;
 border-radius:8px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}

.title{
 font-size:20px;
 font-weight:bold;
}

/* FRASE */
.chip{
 background:rgba(255,255,255,0.2);
 border:1px solid rgba(255,255,255,0.3);
 padding:6px 12px;
 border-radius:20px;
 font-size:12px;
 margin-left:15px;
}

/* BUTTON */
.infoBtn{
 background:white;
 color:#3DCD58;
 border:none;
 padding:8px 12px;
 border-radius:12px;
 cursor:pointer;
 font-weight:bold;
}

.wrap{
 display:grid;
 grid-template-columns: 3fr 1fr;
 gap:20px;
 padding:20px;
 max-width:1500px;
 margin:auto;
}

/* PANEL */
.panel{
 background:white;
 border-radius:15px;
 padding:15px;
}

/* INPUT */
input, textarea{
 width:100%;
 padding:10px;
 border-radius:10px;
 border:1px solid #ccc;
 margin-bottom:10px;
}

textarea{
 min-height:150px;
}

/* BUTTON */
button{
 background:var(--green);
 color:white;
 border:none;
 padding:10px;
 border-radius:10px;
 cursor:pointer;
}

/* GRID */
.feed{
 display:grid;
 grid-template-columns: repeat(4,1fr);
 gap:15px;
}

/* CARD */
.card{
 background:linear-gradient(135deg,#3DCD58,#2196f3);
 color:white;
 padding:15px;
 border-radius:15px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}

/* TEXT */
.reason{
 white-space:pre-wrap;
 word-break:break-word;
}

/* BADGE IMPACT */
.badge{
 background:rgba(255,255,255,0.2);
 padding:5px 10px;
 border-radius:20px;
 font-size:12px;
 align-self:flex-end;
 margin-top:10px;
}

/* SIDEBAR */
.block{
 border:1px solid #ddd;
 border-radius:10px;
 margin-bottom:10px;
}

.blockHeader{
 padding:10px;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
}

/* TOAST */
.toast{
 position:fixed;
 bottom:20px;
 right:20px;
 padding:12px;
 border-radius:15px;
 color:white;
}

/* MODAL */
.modal{
 display:none;
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.5);
 justify-content:center;
 align-items:center;
}

.modal-content{
 background:white;
 padding:20px;
 border-radius:15px;
 max-width:400px;
}

</style>
</head>

<body>

<header>

<div class="header-left">
 <div class="logo">SE</div>
 <div class="title">Recognition Wall</div>

 <div class="chip">
 Reconociendo el día a día, no solo el resultado final
 </div>
</div>

<div>
 <button class="infoBtn" onclick="openInfo()">Información</button>
 <span style="margin-left:10px;">Conectado ✅</span>
</div>

</header>

<div class="wrap">

<!-- MAIN -->
<div class="panel">

<input id="user" placeholder="¿A quién reconoces?">
<input id="by" placeholder="¿Quién reconoce?">
<textarea id="reason" placeholder="Comentario..."></textarea>

<button onclick="add()">Publicar reconocimiento</button>

<div class="feed" id="feed"></div>

</div>

<!-- SIDEBAR -->
<div>

<div class="block">
 <div class="blockHeader">🏆 Ranking</div>
 <div id="ranking"></div>
</div>

<div class="block">
 <div class="blockHeader">🟢 Pendientes</div>
 <div id="needs"></div>
</div>

</div>

</div>

<div id="toast" class="toast"></div>

<!-- MODAL -->
<div id="modal" class="modal">
 <div class="modal-content">
  <h3>Cómo usar Recognition Wall</h3>

  <ul>
   <li>No reconocer a la misma persona 2 veces seguidas</li>
   <li>Cooldown: 7 días</li>
   <li>Visible por 4 días</li>
   <li>Usa valores IMPACT</li>
   <li>Reconoce el día a día</li>
  </ul>

  <button onclick="closeInfo()">Cerrar</button>
 </div>
</div>

<script>

const API="https://recognition-backend-lz5r.onrender.com/recognitions";
const API_KEY="recognition123secure";

function toast(msg,type="error"){
 const t=document.getElementById("toast");
 t.innerText=msg;

 t.style.background = type==="error" ? "#dc2626" : "#16a34a";

 setTimeout(()=>t.innerText="",2500);
}

async function load(){

 const res=await fetch(API,{
  headers:{"x-api-key":API_KEY}
 });
 const data=await res.json();

 feed.innerHTML="";

 data.forEach(r=>{
 feed.innerHTML+=`
 <div class="card">

   <div>
     <strong>${r.recognizedUser}</strong><br>
     <small>reconocido por ${r.recognizedBy}</small>
   </div>

   <div class="reason">${r.reason}</div>

   <div class="badge">
     ${r.impactValue}
   </div>

 </div>`;
 });

 const lbRes=await fetch(API+"/leaderboard",{headers:{"x-api-key":API_KEY}});
 const lb=await lbRes.json();

 ranking.innerHTML=lb.map(x=>`${x.name} - ${x.points}`).join("<br>");

}

async function add(){

 if(!user.value || !by.value || !reason.value){
  toast("Completa los campos","error");
  return;
 }

 await fetch(API,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "x-api-key":API_KEY
  },
  body:JSON.stringify({
   recognizedUser:user.value,
   recognizedBy:by.value,
   reason:reason.value,
   impactValue:"purpose"
  })
 });

 toast("Reconocimiento enviado","success");

 load();
}

/* MODAL */
function openInfo(){
 modal.style.display="flex";
}

function closeInfo(){
 modal.style.display="none";
}

load();

</script>

</body>
</html>
``
